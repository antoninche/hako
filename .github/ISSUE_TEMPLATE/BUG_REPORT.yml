# Formulaire « Signaler un problème » : la partie touchée (site, HakOS ou box),
# ce qui se passe, comment le reproduire. Les failles de sécurité passent par
# SECURITY.md, jamais par une issue publique.
name: 🐛 Signaler un problème
description: Quelque chose ne marche pas sur le site, dans HakOS ou sur la box.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de nous signaler un problème !

        - **Une faille de sécurité ?** Ne l'écrivez pas ici : suivez la [politique de sécurité](https://github.com/antoninche/hako/security/policy).
        - **N'écrivez jamais** de mot de passe, de fiche d'installation, ni de photo d'une famille : cette issue est publique.
        - Cherchez d'abord si le problème est [déjà signalé](https://github.com/antoninche/hako/issues).
  - type: dropdown
    id: partie
    attributes:
      label: Partie
      description: Où se trouve le problème ?
      options:
        - Site (antoninche.github.io/hako, dossier site/)
        - HakOS (système de la box, dossier hakos/)
        - Box (page de la HAKO, page d'état, Immich ou Nextcloud sur la box)
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Décrivez le problème en quelques phrases.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire
      description: Les étapes, une par ligne.
      placeholder: |
        1. Ouvrir la page …
        2. Cliquer sur …
        3. Voir …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Pour le site, l'adresse de la page ; pour HakOS ou la box, la version affichée sur la page d'état (http://hako.local) ou le nom de l'image.
      placeholder: ex. HakOS 2026.11.2
  - type: input
    id: appareil
    attributes:
      label: Appareil et navigateur
      placeholder: ex. iPhone 15, Safari ; PC Windows 11, Firefox
  - type: textarea
    id: journaux
    attributes:
      label: Captures et journaux
      description: Captures d'écran, messages d'erreur ou extrait de journal, sans aucun mot de passe.
      render: text
  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: Ce signalement ne contient ni mot de passe, ni fiche d'installation, ni donnée personnelle.
          required: true
