# Licence de chaque fichier du dépôt, au format REUSE (https://reuse.software).
# Les textes des licences sont dans LICENSES/. Quand plusieurs blocs visent le
# même fichier, le dernier l'emporte : du plus général au plus précis.
# Contrôle : reuse lint (workflow .github/workflows/reuse.yml).
version = 1
SPDX-PackageName = "hako"
SPDX-PackageSupplier = "Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-PackageDownloadLocation = "https://github.com/antoninche/hako"

# Racine du dépôt : fichiers communautaires, configuration, workflows.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "MIT"

# Code de conduite : Contributor Covenant 2.1, traduction française.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Le site : licence MIT (site/LICENSE).
[[annotations]]
path = "site/**"
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "MIT"

# HakOS : GNU GPL version 3 ou ultérieure (hakos/LICENSE).
[[annotations]]
path = "hakos/**"
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Page de la HAKO dans HakOS : construite depuis site/ (MIT), copiée telle quelle.
[[annotations]]
path = "hakos/rootfs/opt/box/home/assistant/**"
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "MIT"

# Liste de mots des mots de passe : liste française de diceware (CC0 1.0),
# voir hakos/docs/liste-de-mots.md.
[[annotations]]
path = "hakos/rootfs/opt/box/assistant/mots.txt"
SPDX-FileCopyrightText = "diceware contributors"
SPDX-License-Identifier = "CC0-1.0"

# Textes du site : réservés (NOTICE). Les fichiers de src/data/ mêlent du code
# (MIT) et des phrases (réservées).
[[annotations]]
path = ["site/src/content/**", "site/docs/**.md", "site/README.md"]
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "LicenseRef-HAKO-Reserve"

[[annotations]]
path = "site/src/data/**"
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "MIT AND LicenseRef-HAKO-Reserve"

# Nom, logo, kanji 箱, photos, portraits, prototype, dessins et captures :
# réservés (NOTICE).
[[annotations]]
path = [
  ".github/assets/**",
  "site/brand/**",
  "site/design/**",
  "site/images/**",
  "site/qa/logo/**",
  "site/public/brand/**",
  "site/public/equipe/**",
  "site/public/images/**",
  "site/public/og/**",
  "site/public/icons/**",
  "site/public/favicon.ico",
  "site/public/favicon.svg",
  "site/public/apple-touch-icon.png",
  "site/src/assets/brand/**",
  "site/src/assets/illustrations/**",
  "site/src/assets/prototype/**",
  "hakos/rootfs/opt/box/home/assistant/_astro/hako-*.svg",
  "hakos/rootfs/opt/box/home/assistant/favicon.*",
  "hakos/rootfs/opt/box/home/site/favicon.svg",
]
SPDX-FileCopyrightText = "2026 Antonin Chenavaz, Maxime Pollaud, Martin Dugail"
SPDX-License-Identifier = "LicenseRef-HAKO-Reserve"

# Polices : SIL Open Font License 1.1, celle de leurs auteurs.
[[annotations]]
path = ["site/public/fonts/fraunces/**", "hakos/rootfs/opt/box/home/*/fonts/fraunces/**"]
SPDX-FileCopyrightText = "2018 The Fraunces Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "site/public/fonts/atkinson-hyperlegible-next/**",
  "hakos/rootfs/opt/box/home/*/fonts/atkinson-hyperlegible-next/**",
]
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/public/fonts/d-din/**", "hakos/rootfs/opt/box/home/*/fonts/d-din/**"]
SPDX-FileCopyrightText = "2017 Datto Inc."
SPDX-License-Identifier = "OFL-1.1"

# Icônes des réseaux sociaux (site/docs/licences.md). Les marques restent à
# leurs propriétaires.
[[annotations]]
path = [
  "site/src/assets/icons/social/youtube.svg",
  "site/src/assets/icons/social/facebook.svg",
  "site/src/assets/icons/social/instagram.svg",
  "hakos/rootfs/opt/box/home/assistant/_astro/youtube.*.svg",
  "hakos/rootfs/opt/box/home/assistant/_astro/facebook.*.svg",
  "hakos/rootfs/opt/box/home/assistant/_astro/instagram.*.svg",
]
SPDX-FileCopyrightText = "Simple Icons contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["site/src/assets/icons/social/peertube.svg", "hakos/rootfs/opt/box/home/assistant/_astro/peertube.*.svg"]
SPDX-FileCopyrightText = "Framasoft"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "site/src/assets/icons/social/linkedin.svg",
  "hakos/rootfs/opt/box/home/assistant/_astro/linkedin.*.svg",
  "site/public/licences/bootstrap-icons-LICENSE.txt",
  "hakos/rootfs/opt/box/home/assistant/licences/bootstrap-icons-LICENSE.txt",
]
SPDX-FileCopyrightText = "2019-2024 The Bootstrap Authors"
SPDX-License-Identifier = "MIT"

# Textes des licences des bibliothèques envoyées aux visiteurs.
[[annotations]]
path = "site/public/licences/three-LICENSE.txt"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "site/public/licences/meshoptimizer-LICENSE.txt"
SPDX-FileCopyrightText = "2016-2026 Arseny Kapoulkine"
SPDX-License-Identifier = "MIT"
