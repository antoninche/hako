# shellcheck shell=bash disable=SC2034
# HakoS, profil prod : image livrée aux clients, promesse « zéro accès ».
# Aucune clé SSH, SSH masqué et compte hako verrouillé par stage-box/00-systeme.
#
# pi-gen exige un mot de passe pour le compte quand DISABLE_FIRST_BOOT_USER_RENAME=1 :
# scripts/construire.sh prod le tire au hasard et ne l'écrit que dans la config provisoire,
# effacée à la fin de la construction. Personne ne le connaît.
#
# Nom de l'image : image_<date>-hakos-prod.img.xz (IMG_NAME=hakos, suffixe -prod posé par
# stage-box/EXPORT_IMAGE d'après HAKOS_PROFIL).

# PUBKEY_ONLY_SSH=1 exigerait une clé (build.sh refuse sans PUBKEY_SSH_FIRST_USER) ; la connexion
# par mot de passe reste coupée par /etc/ssh/sshd_config.d/10-hakos.conf.
ENABLE_SSH=0
PUBKEY_ONLY_SSH=0
