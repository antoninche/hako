# shellcheck shell=bash disable=SC2034
# HakOS, profil dev : image de l'équipe, avec SSH par clé seulement.
# Cette image ne doit jamais être installée chez un client.
#
# scripts/construire.sh dev ajoute dans la config provisoire, jamais dans ce fichier :
#   - les clés publiques de l'équipe, lues dans local/cles-ssh-dev.pub (PUBKEY_SSH_FIRST_USER) ;
#   - le mot de passe console du compte hako, lu dans local/mot-de-passe-dev.
#
# Nom de l'image : image_<date>-hakos-dev.img.xz (IMG_NAME=hakos, suffixe -dev posé par
# stage-box/EXPORT_IMAGE d'après HAKOS_PROFIL).

ENABLE_SSH=1
PUBKEY_ONLY_SSH=1
