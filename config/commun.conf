# shellcheck shell=bash disable=SC2034
# HakoS : configuration pi-gen commune aux profils dev et prod, sans aucun secret.
# scripts/construire.sh assemble la config complète dans local/pigen.conf : ce fichier, puis
# config/dev.conf ou config/prod.conf, puis le mot de passe du compte, les clés SSH (dev seulement),
# STAGE_LIST, HAKOS_RACINE et HAKOS_PROFIL. C'est un fragment bash, lu par build-docker.sh sur
# le Mac puis par build.sh dans le conteneur.

IMG_NAME=hakos
PI_GEN_RELEASE="HakoS"
RELEASE=trixie
DEPLOY_COMPRESSION=xz

# Adresse http://hako.local (avahi) ; une deuxième box sur le même réseau devient hako-2.local.
TARGET_HOSTNAME=hako
LOCALE_DEFAULT=fr_FR.UTF-8
KEYBOARD_KEYMAP=fr
KEYBOARD_LAYOUT="French"
TIMEZONE_DEFAULT=Europe/Paris

# Wi-Fi : réglementation radio française, Wi-Fi débloqué, aucun réseau préconfiguré.
# L'Ethernet reste la connexion conseillée. Le Bluetooth reste actif.
WPA_COUNTRY=FR

# Compte fixe hako, jamais renommé au premier démarrage. Son mot de passe vient de construire.sh.
# cloud-init est gardé tel quel (ENABLE_CLOUD_INIT reste à sa valeur par défaut, 1).
FIRST_USER_NAME=hako
DISABLE_FIRST_BOOT_USER_RENAME=1
