# HakoS : réglages du serveur SSH. Ce dossier est lu avant /etc/ssh/sshd_config, et la première
# valeur lue l'emporte. Profil dev : connexion par clé seulement. Profil prod : SSH est masqué,
# ce fichier reste une protection de plus.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
