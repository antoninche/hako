# Page d'accueil de HakoS, montée à la place de /etc/nginx/conf.d/default.conf dans le conteneur.
# Un seul site, sur le port 80 du réseau de la maison, sans HTTPS.
server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;
	server_tokens off;

	# En-têtes de sécurité sur toutes les réponses. Le site n'a aucun script : la politique de
	# contenu n'autorise que ses propres feuilles de style, polices et images.
	add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	# Les deux applications, sur le nom ou l'adresse IP qui a servi à ouvrir cette page
	# ($host : hako.local, hako-2.local ou 192.168.x.y).
	location = /photos {
		return 302 http://$host:2283/;
	}

	location = /fichiers {
		return 302 http://$host:8080/;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
