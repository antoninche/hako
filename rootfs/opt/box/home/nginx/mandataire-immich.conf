# Mandataire vers Immich (127.0.0.1:12283), inclus dans un bloc server : par le port 2283
# (photos.conf, adresse de secours) et par le nom hako-photos.local sur le port 80 (noms.conf).
# Freine les essais de mot de passe : 10 par minute et par adresse (10 d'un coup, puis un toutes
# les 6 s), réponse 429 au-delà. Immich, lui, ne freine rien. Le compteur (zone immich_connexion,
# defaut.conf) est commun aux deux entrées : changer d'adresse ne donne pas d'essais en plus.
# Réglages repris de la documentation d'Immich (gros envois, websockets, délais).
client_max_body_size 50000M;
proxy_request_buffering off;
client_body_buffer_size 1024k;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_redirect off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
send_timeout 600s;

# Les routes qui reçoivent un mot de passe ou un code.
location ~ ^/api/auth/(login|change-password|session/unlock|pin-code)$ {
	limit_req zone=immich_connexion burst=9 nodelay;
	proxy_pass http://127.0.0.1:12283;
}

location / {
	proxy_pass http://127.0.0.1:12283;
}
