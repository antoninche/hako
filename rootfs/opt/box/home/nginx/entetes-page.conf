# En-têtes de la page de la HAKO et de son API : BOX_PAGE_HEADERS de
# src/lib/assistant/box-access.ts (dépôt hako-site). Pas d'upgrade-insecure-requests : la HAKO
# parle en HTTP sur le réseau de la maison. Rien en cache, aucune adresse transmise ailleurs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Cache-Control "no-store" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
