# Port 80 une fois la HAKO installée : la page d'accueil (./site). Incluse par phase.conf
# (/var/lib/hakos/accueil, écrit par l'assistant ou par /opt/box/lib/phase.sh). Sans HTTPS.
server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	# En-têtes de sécurité sur toutes les réponses. Le site n'a aucun script : la politique de
	# contenu n'autorise que ses propres feuilles de style, polices et images.
	add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	# Les deux applications, sur le nom ou l'adresse IP qui a servi à ouvrir cette page
	# ($host : hako.local, hako-2.local ou 192.168.x.y).
	location = /photos {
		return 302 http://$host:2283/;
	}

	location = /fichiers {
		return 302 http://$host:8080/;
	}

	# La page de la première installation, restée ouverte, demande encore l'état : réponse fixe,
	# le service de l'assistant est arrêté et masqué. Toute autre route : mauvaise phase.
	location = /api/installation/status {
		include /etc/nginx/hakos/entetes-page.conf;
		default_type application/json;
		return 200 '{"phase":"installed","busy":false}';
	}

	location /api/installation/ {
		include /etc/nginx/hakos/entetes-page.conf;
		default_type application/json;
		return 409 '{"error":"wrong_phase"}';
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
