# Port 80 une fois la HAKO installée : la page d'état de la HAKO (./site) et les noms des
# applications (noms.conf). Incluse par phase.conf (/var/lib/hakos/accueil, écrit par l'assistant
# ou par /opt/box/lib/phase.sh). Sans HTTPS.
server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	# En-têtes de sécurité sur toutes les réponses. La page n'a qu'un script, le sien (accueil.js),
	# qui ne lit que /api/etat : la politique de contenu n'autorise rien d'autre que la box. Rien en
	# cache : l'état change chaque minute, et la page change avec HakOS.
	add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	# Les deux applications par leur nom (hako.local → hako-photos.local, hako-2.local →
	# hako-2-photos.local) ; ouverte par l'adresse IP de la box, la page renvoie vers les ports de
	# secours de cette adresse.
	location = /photos {
		if ($hakos_nom) {
			return 302 http://$hakos_nom-photos.local/;
		}
		return 302 http://$host:2283/;
	}

	location = /fichiers {
		if ($hakos_nom) {
			return 302 http://$hakos_nom-fichiers.local/;
		}
		return 302 http://$host:8080/;
	}

	# État de la box, en JSON, sans aucun secret : écrit chaque minute par hakos-etat
	# (/opt/box/etat/etat.py) dans /run/hakos-etat, monté en lecture seule.
	location = /api/etat {
		default_type application/json;
		alias /run/hakos-etat/etat.json;
	}

	# La page de la première installation, restée ouverte, demande encore l'état : réponse fixe,
	# le service de l'assistant est arrêté et masqué. Toute autre route : mauvaise phase.
	location = /api/installation/status {
		include /etc/nginx/hakos/entetes-page.conf;
		default_type application/json;
		return 200 '{"phase":"installed","busy":false}';
	}

	location /api/installation/ {
		include /etc/nginx/hakos/entetes-page.conf;
		default_type application/json;
		return 409 '{"error":"wrong_phase"}';
	}

	location = /arret.html {
		return 404;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

include /etc/nginx/hakos/noms.conf;
