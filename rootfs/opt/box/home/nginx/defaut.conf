# HakOS : configuration du nginx de l'accueil, montée à la place de /etc/nginx/conf.d/default.conf.
# Le conteneur partage le réseau de la box (network_mode: host) : il écoute en IPv4 seulement,
# voit la vraie adresse de chaque appareil (pour les freins des mots de passe) et joint 127.0.0.1.
#   - port 2283 : Immich, toujours (photos.conf) ; le pare-feu le ferme avant l'installation ;
#   - port 80 : la page de la première installation (assistant.conf), puis l'accueil et les noms
#     des applications (accueil.conf, noms.conf), ou la page d'arrêt si le premier démarrage a
#     refusé le matériel (arret.conf). Le choix est dans phase.conf, que le dossier
#     /var/lib/hakos/accueil fournit (lib/phase.sh).
server_tokens off;

limit_req_zone $binary_remote_addr zone=immich_connexion:1m rate=10r/m;
limit_req_status 429;

# Nom de la box d'après le nom demandé : hako.local → hako, hako-2.local → hako-2 ; vide pour une
# adresse IP. Sert aux renvois /photos et /fichiers de l'accueil (accueil.conf).
map $host $hakos_nom {
	~^(?<nom>hako(-[0-9]+)?)(\.local)?$ $nom;
	default "";
}

include /etc/nginx/hakos/photos.conf;
include /etc/nginx/hakos-etat/phase.conf;
