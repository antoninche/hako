# Lot 0 : image Lite de référence, pi-gen sans étape maison.
# Sert seulement à prouver que la chaîne de construction marche et que l'image démarre sur SSD.
# Le mot de passe et les clés SSH sont ajoutés au moment de la construction par
# scripts/construire-stock.sh, à partir de fichiers locaux jamais versionnés (dossier local/).

IMG_NAME=mabox-stock
RELEASE=trixie
STAGE_LIST="stage0 stage1 stage2"
DEPLOY_COMPRESSION=xz

TARGET_HOSTNAME=mabox-test
LOCALE_DEFAULT=fr_FR.UTF-8
KEYBOARD_KEYMAP=fr
KEYBOARD_LAYOUT="French"
TIMEZONE_DEFAULT=Europe/Paris

# Compte de test fixe, connexion SSH par clé uniquement.
FIRST_USER_NAME=mabox
DISABLE_FIRST_BOOT_USER_RENAME=1
ENABLE_SSH=1
PUBKEY_ONLY_SSH=1
