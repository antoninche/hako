# Port 80 avant l'installation : la page de la HAKO (./assistant, construite depuis le dossier
# site/ de antoninche/hako au commit HAKO_SITE_COMMIT de versions.env) et son API locale, servie
# par le service hakos-assistant sur un socket Unix. Incluse par phase.conf (/var/lib/hakos/accueil).
server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/assistant;
	index index.html;
	charset utf-8;

	# En-têtes du contrat de la page (BOX_PAGE_HEADERS de box-access.ts), sur toutes les réponses.
	include /etc/nginx/hakos/entetes-page.conf;

	location /api/installation/ {
		# JSON de 16 Kio au plus ; ni adresse du client ni cookie transmis au service.
		client_max_body_size 16k;
		proxy_pass http://unix:/run/hakos-assistant/api.sock;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Connection "";
		proxy_set_header Cookie "";
		proxy_hide_header Cache-Control;
		proxy_connect_timeout 3s;
		proxy_read_timeout 20s;
		proxy_send_timeout 20s;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
