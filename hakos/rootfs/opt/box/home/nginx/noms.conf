# Port 80, une fois la HAKO installée : les applications par leur nom, annoncé par le service
# hakos-noms (avahi) : hako-photos.local vers Immich, hako-fichiers.local vers Nextcloud, et
# hako-2-photos.local, hako-2-fichiers.local… pour une deuxième box sur le même réseau.
# Inclus par accueil.conf seulement : avant l'installation, ces noms tombent sur la page de la
# HAKO (assistant.conf), jamais sur les applications. Ports 2283 et 8080 gardés en secours.

server {
	listen 80;
	server_name ~^hako(-[0-9]+)?-photos(\.local)?$;

	include /etc/nginx/hakos/mandataire-immich.conf;
}

# Nextcloud : publié par Docker sur le port 8080 (adresse de secours). Il fait confiance à
# l'en-tête X-Forwarded-For venu de ce nginx (trusted_proxies, réglé au premier démarrage) : son
# frein des mots de passe voit la vraie adresse de chaque appareil. Réglages de mandataire d'après
# la documentation de Nextcloud (gros envois, réponses en flux, délais).
server {
	listen 80;
	server_name ~^hako(-[0-9]+)?-fichiers(\.local)?$;

	client_max_body_size 16G;
	client_body_buffer_size 512k;
	proxy_request_buffering off;
	proxy_buffering off;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		proxy_redirect off;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		send_timeout 600s;
	}
}
