# Port 80 quand le premier démarrage a refusé le matériel (marqueur /var/lib/hakos/arret, posé par
# /opt/box/lib/premier-demarrage.sh) : une page fixe dit quoi faire (./site/arret.html). Immich et
# Nextcloud ne démarrent pas ; les ports 2283 et 8080 restent fermés. Incluse par phase.conf.
server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	charset utf-8;

	add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header Cache-Control "no-store" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;

	location ~ ^/(style\.css|favicon\.svg|fonts/.+\.woff2)$ {
		try_files $uri =404;
	}

	# Une page de la première installation restée ouverte : la box ne répond plus à l'API.
	location /api/ {
		default_type application/json;
		return 503 '{"error":"stopped"}';
	}

	location / {
		try_files /arret.html =404;
	}
}
