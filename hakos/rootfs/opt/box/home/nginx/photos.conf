# Port 2283 : Immich (photos), adresse de secours de hako-photos.local. Immich est publié par
# Docker sur 127.0.0.1:12283 seulement ; nginx le sert au réseau de la maison, avec le frein des
# mots de passe (mandataire-immich.conf). Le pare-feu ferme ce port avant l'installation.
server {
	listen 2283;
	server_name _;

	include /etc/nginx/hakos/mandataire-immich.conf;
}
