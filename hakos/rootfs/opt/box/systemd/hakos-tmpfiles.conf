# HakOS : dossiers de l'assistant de première installation et de la page d'état (tmpfiles.d,
# créés à chaque démarrage).
#   /run/hakos-assistant      socket de l'API, monté dans le conteneur nginx de l'accueil
#   /var/lib/hakos            état : marqueur « installee » (fait foi pour le pare-feu)
#   /var/lib/hakos/accueil    phase.conf, monté dans le conteneur nginx de l'accueil
#   /run/hakos-etat           etat.json (hakos-etat), monté dans le conteneur nginx de l'accueil
d /run/hakos-assistant 0755 hakos-assistant hakos-assistant -
d /var/lib/hakos 0755 hakos-assistant hakos-assistant -
d /var/lib/hakos/accueil 0755 hakos-assistant hakos-assistant -
d /run/hakos-etat 0755 root root -
